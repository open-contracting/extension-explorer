name: Lint
on: [push, pull_request]
jobs:
  lint:
    uses: open-contracting/.github/.github/workflows/lint.yml@main
    permissions:
      contents: write
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      private-key: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      # pysassc and ocdsextensionregistry are run as commands in a workflow.
      standard-maintenance-scripts-ignore: libsass,ocdsextensionregistry
      # Defer indentation to biome format.
      ocds-noindent: 'yes'
